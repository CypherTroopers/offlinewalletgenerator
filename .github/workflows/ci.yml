name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOSUMDB: sum.golang.org

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify
        run: |
          go mod download
          go mod verify
          test -z "$(gofmt -l main.go main_test.go)"
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 ./...

      - name: Build and smoke-test
        run: |
          go build -mod=readonly -trimpath -buildvcs=false -o build/ .
          binary=./build/coldwalletgenerator
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          "$binary" > /dev/null

  update-binaries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOSUMDB: sum.golang.org

    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build prebuilt binaries
        run: |
          rm -rf bin
          mkdir -p             bin/linux-amd64             bin/linux-arm64             bin/windows-amd64             bin/windows-arm64             bin/darwin-amd64             bin/darwin-arm64

          GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -buildvcs=false -o bin/linux-amd64/coldwalletgenerator .
          GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath -buildvcs=false -o bin/linux-arm64/coldwalletgenerator .
          GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -buildvcs=false -o bin/windows-amd64/coldwalletgenerator.exe .
          GOOS=windows GOARCH=arm64 go build -mod=readonly -trimpath -buildvcs=false -o bin/windows-arm64/coldwalletgenerator.exe .
          GOOS=darwin GOARCH=amd64 go build -mod=readonly -trimpath -buildvcs=false -o bin/darwin-amd64/coldwalletgenerator .
          GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -buildvcs=false -o bin/darwin-arm64/coldwalletgenerator .

          chmod +x             bin/linux-amd64/coldwalletgenerator             bin/linux-arm64/coldwalletgenerator             bin/darwin-amd64/coldwalletgenerator             bin/darwin-arm64/coldwalletgenerator

          (
            cd bin
            sha256sum               linux-amd64/coldwalletgenerator               linux-arm64/coldwalletgenerator               windows-amd64/coldwalletgenerator.exe               windows-arm64/coldwalletgenerator.exe               darwin-amd64/coldwalletgenerator               darwin-arm64/coldwalletgenerator               > SHA256SUMS
          )

      - name: Commit prebuilt binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bin
          if git diff --cached --quiet; then
            echo "Prebuilt binaries are already up to date."
            exit 0
          fi
          git commit -m "build: update prebuilt binaries [skip ci]"
          git push origin HEAD:main
