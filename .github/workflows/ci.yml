name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/native-build.yml

  update-binaries:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit, not the latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Download binaries from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: .native-artifacts
          merge-multiple: false
          digest-mismatch: error

      - name: Validate all six artifacts and assemble bin without rebuilding
        run: python3 scripts/collect_binaries.py .native-artifacts bin "$GITHUB_SHA"

      - name: Commit only while main still points to the tested source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "main advanced; refusing to publish stale binaries." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -f bin
          if git diff --cached --quiet; then
            echo "Tested binaries are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish six natively tested binaries [skip ci]"
          # Never force-push or rebase: a concurrent source change must reject this push.
          git push origin HEAD:refs/heads/main
