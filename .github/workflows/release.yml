name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/native-build.yml

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOSUMDB: sum.golang.org
      GOWORK: "off"
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go for dependency and license packaging
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download natively tested binaries from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: .native-artifacts
          merge-multiple: false
          digest-mismatch: error

      - name: Validate and collect tested binaries
        run: python3 scripts/collect_binaries.py .native-artifacts bin "$GITHUB_SHA"

      - name: Package the tested binaries without recompiling them
        run: bash scripts/build-release.sh --prebuilt

      - name: Publish a draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --draft --verify-tag --generate-notes
